name: Build client

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows UCRT64
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gdb
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openal
            mingw-w64-ucrt-x86_64-zlib
      - name: Fetch pinned sources
        run: cmake -P tools/fetch_dependencies.cmake
      - name: Configure and build
        run: |
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ci --parallel 4
      - name: Tests and menu smoke
        run: |
          ctest --test-dir build/ci --output-on-failure
          test "$(build/ReCraft.exe --version)" = "ReCraft $(cat VERSION)"
          if ! build/ReCraft.exe --menu-smoke --window-check --no-audio --frames 30 --capture build/menu.png; then
            gdb --batch -ex run -ex 'thread apply all bt' --args build/ReCraft.exe --menu-smoke --no-audio --frames 30
            exit 1
          fi
      - name: Package runtime
        run: |
          version="$(cat VERSION)"
          package_dir="$PWD/build/package-${{ github.run_id }}-${{ github.run_attempt }}/ReCraft-$version-windows-x64"
          cmake -DRUNTIME_DIR="$PWD/build" -DOUTPUT_DIR="$package_dir" -DRUNTIME_DLL_DIR="$(cygpath -m "$MINGW_PREFIX/bin")" -P tools/package_runtime.cmake
          cmake -DPACKAGE_DIR="$package_dir" -DARCHIVE_DIR="$PWD/build/archives" -P tools/archive_runtime.cmake
          echo "version=$version" >> "$GITHUB_ENV"
      - name: Scan Windows archive with Microsoft Defender
        shell: pwsh
        run: |
          ./tools/scan_windows_package.ps1 -PackagePath "build/archives/ReCraft-$env:version-windows-x64.zip" -ReportPath build/archives/windows-defender-scan.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ReCraft-${{ env.version }}-windows-x64
          path: |
            build/archives/ReCraft-${{ env.version }}-windows-x64.zip
            build/archives/ReCraft-${{ env.version }}-windows-x64.zip.sha256
            build/archives/windows-defender-scan.txt
          if-no-files-found: error

  linux:
    name: Linux X11
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libopenal-dev zlib1g-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev xvfb xauth
      - name: Fetch pinned sources
        run: cmake -P tools/fetch_dependencies.cmake
      - name: Configure and build
        run: |
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ci --parallel 4
      - name: Tests and menu smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a ctest --test-dir build/ci --output-on-failure
          test "$(build/ReCraft --version)" = "ReCraft $(cat VERSION)"
          xvfb-run -a build/ReCraft --menu-smoke --window-check --no-audio --frames 30 --capture build/menu.png
      - name: Package runtime
        run: |
          version="$(cat VERSION)"
          package_dir="$PWD/build/package-${{ github.run_id }}-${{ github.run_attempt }}/ReCraft-$version-linux-x64"
          cmake -DRUNTIME_DIR="$PWD/build" -DOUTPUT_DIR="$package_dir" -P tools/package_runtime.cmake
          cmake -DPACKAGE_DIR="$package_dir" -DARCHIVE_DIR="$PWD/build/archives" -P tools/archive_runtime.cmake
          python3 -m unittest discover -s tests -p release_tools_test.py
          echo "version=$version" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ReCraft-${{ env.version }}-linux-x64
          path: |
            build/archives/ReCraft-${{ env.version }}-linux-x64.tar.gz
            build/archives/ReCraft-${{ env.version }}-linux-x64.tar.gz.sha256
          if-no-files-found: error

  macos:
    name: macOS Vesper
    # Only trusted pushes/manual runs execute code on the user's local machine.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS, X64, Vesper]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          clean: false
      - name: Check toolchain
        run: |
          export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"
          xcode-select -p
          if ! command -v cmake >/dev/null; then
            brew install cmake
          fi
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          sw_vers
          clang --version
      - name: Fetch pinned sources
        run: cmake -P tools/fetch_dependencies.cmake
      - name: Configure and build
        run: |
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build build/ci --parallel 2
      - name: Tests
        run: ctest --test-dir build/ci --timeout 60 --output-on-failure
      - name: Diagnose renderer startup failure
        if: failure()
        run: |
          clang -x objective-c tools/macos_gl_probe.m -framework Cocoa -framework OpenGL -o build/macos-gl-probe
          build/macos-gl-probe
          build/ci/renderer_test > build/renderer-startup.log 2>&1 &
          probe_pid=$!
          trap 'kill "$probe_pid" 2>/dev/null || true' EXIT
          sleep 5
          if kill -0 "$probe_pid" 2>/dev/null; then
            /usr/bin/sample "$probe_pid" 1 -file build/renderer-sample.txt || true
            grep -E 'glfw|AppKit|NSApplication|OpenGL|CGL|mach_msg|HID|CoreGraphics' build/renderer-sample.txt || true
          fi
          cat build/renderer-startup.log
      - name: Version and menu smoke
        run: |
          test "$(build/ReCraft.app/Contents/MacOS/ReCraft --version)" = "ReCraft $(cat VERSION)"
          if /bin/launchctl print "gui/$(id -u)" >/dev/null 2>&1; then
            sh tools/run_macos_gui.sh build/ReCraft.app/Contents/MacOS/ReCraft --menu-smoke --no-audio --frames 30 --capture build/menu.png
          else
            echo "No Aqua session: render the actual UI through the native CGL test drawable."
            build/ci/renderer_test --menu-capture build/menu.png
          fi
      - name: Package runtime
        run: |
          version="$(cat VERSION)"
          package_dir="$PWD/build/package-${{ github.run_id }}-${{ github.run_attempt }}/ReCraft-$version-macos-x64"
          cmake -DRUNTIME_DIR="$PWD/build" -DOUTPUT_DIR="$package_dir" -P tools/package_runtime.cmake
          cmake -DPACKAGE_DIR="$package_dir" -DARCHIVE_DIR="$PWD/build/archives" -P tools/archive_runtime.cmake
          echo "version=$version" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ReCraft-${{ env.version }}-macos-x64
          path: |
            build/archives/ReCraft-${{ env.version }}-macos-x64.tar.gz
            build/archives/ReCraft-${{ env.version }}-macos-x64.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish verified release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check version tag
        run: |
          version="$(cat VERSION)"
          test "$GITHUB_REF_NAME" = "v$version"
          echo "version=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ReCraft-${{ env.version }}-*
          merge-multiple: true
          path: build/release
      - name: Validate archives and publish complete release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/publish_release.py --directory build/release --version "$version" --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --publish
